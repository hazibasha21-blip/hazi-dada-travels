<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Reset Password | Hazi Dada Travels</title>  <meta name="robots" content="noindex, nofollow">  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="admin.css">
</head><body class="admin-body">  <div class="admin-login-wrap"><div class="admin-login-card">

  <img
    src="logo.png"
    alt="Hazi Dada Travels logo"
  >

  <h1>Hazi Dada Travels</h1>

  <p class="sub">
    <strong>Reset Admin Password</strong>
  </p>

  <!-- Message -->
  <div id="reset-msg"></div>

  <!-- Request reset email -->
  <form id="request-reset-form" novalidate>

    <div class="a-form-group">

      <label for="reset-email">
        Admin Email
      </label>

      <input
        id="reset-email"
        type="email"
        autocomplete="email"
        placeholder="Enter admin email"
        required
      >

    </div>

    <button
      type="submit"
      class="a-btn a-btn-primary a-btn-block"
      id="send-reset-btn"
    >
      Send Reset Link
    </button>

  </form>

  <!-- New password form -->
  <form
    id="new-password-form"
    novalidate
    style="display:none;"
  >

    <div class="a-form-group">

      <label for="new-password">
        New Password
      </label>

      <input
        id="new-password"
        type="password"
        autocomplete="new-password"
        placeholder="Enter new password"
        required
      >

    </div>

    <div class="a-form-group">

      <label for="confirm-password">
        Confirm New Password
      </label>

      <input
        id="confirm-password"
        type="password"
        autocomplete="new-password"
        placeholder="Confirm new password"
        required
      >

    </div>

    <button
      type="submit"
      class="a-btn a-btn-primary a-btn-block"
      id="update-password-btn"
    >
      Update Password
    </button>

  </form>

  <!-- Back to login -->
  <p
    class="sub"
    style="margin-top:1.2rem;"
  >
    <a
      href="login.html"
      style="color:var(--a-blue);font-weight:700;text-decoration:none;"
    >
      ← Back to Login
    </a>
  </p>

</div>

  </div>  <!-- Supabase -->  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <!-- Project Supabase configuration -->  <script src="supabase.js"></script>  <!-- Existing admin helpers -->  <script src="admin.js"></script>  <script>

    document.addEventListener("DOMContentLoaded", async () => {

      const msg =
        document.getElementById("reset-msg");

      const requestForm =
        document.getElementById("request-reset-form");

      const passwordForm =
        document.getElementById("new-password-form");

      const sendBtn =
        document.getElementById("send-reset-btn");

      const updateBtn =
        document.getElementById("update-password-btn");


      /*
       * Show message
       */
      function showMessage(text, type = "info") {

        msg.innerHTML = "";

        const box =
          document.createElement("div");

        box.className =
          "a-msg " + type;

        box.textContent = text;

        msg.appendChild(box);
      }


      /*
       * Show new password form
       */
      function showPasswordForm() {

        requestForm.style.display = "none";

        passwordForm.style.display = "block";

      }


      /*
       * Check existing recovery session
       */
      async function checkRecoverySession() {

        try {

          const { data, error } =
            await supabaseClient.auth.getSession();

          if (error) {
            console.error(
              "Recovery session error:",
              error
            );
            return;
          }

          if (
            data &&
            data.session
          ) {

            showPasswordForm();

            showMessage(
              "Enter your new password.",
              "success"
            );

          }

        } catch (error) {

          console.error(
            "Recovery session check failed:",
            error
          );

        }

      }


      /*
       * Check Supabase availability
       */
      if (
        typeof supabaseClient === "undefined" ||
        !supabaseClient ||
        !supabaseClient.auth
      ) {

        showMessage(
          "Supabase is not available. Please try again.",
          "error"
        );

        return;

      }


      /*
       * Listen for password recovery
       */
      supabaseClient.auth.onAuthStateChange(
        async (event, session) => {

          console.log(
            "Auth event:",
            event
          );

          if (
            event === "PASSWORD_RECOVERY" &&
            session
          ) {

            showPasswordForm();

            showMessage(
              "Enter your new password.",
              "success"
            );

          }

        }
      );


      /*
       * Check whether this page
       * already has a recovery session.
       */
      await checkRecoverySession();


      /*
       * Request password reset email
       */
      requestForm.addEventListener(
        "submit",
        async (event) => {

          event.preventDefault();


          const email =
            document
              .getElementById("reset-email")
              .value
              .trim()
              .toLowerCase();


          if (!email) {

            showMessage(
              "Please enter your admin email.",
              "error"
            );

            return;

          }


          sendBtn.disabled = true;

          sendBtn.textContent =
            "Sending...";


          try {

            /*
             * This page is the recovery
             * redirect destination.
             */
            const redirectTo =
              window.location.origin +
              window.location.pathname;


            const { error } =
              await supabaseClient.auth
                .resetPasswordForEmail(
                  email,
                  {
                    redirectTo
                  }
                );


            if (error) {
              throw error;
            }


            showMessage(
              "If the email is registered, a password reset link has been sent. Please check your inbox.",
              "success"
            );


            requestForm.reset();


          } catch (error) {

            console.error(
              "Password reset request failed:",
              error
            );


            showMessage(
              error.message ||
              "Unable to send reset link.",
              "error"
            );


          } finally {

            sendBtn.disabled = false;

            sendBtn.textContent =
              "Send Reset Link";

          }

        }
      );


      /*
       * Update password
       */
      passwordForm.addEventListener(
        "submit",
        async (event) => {

          event.preventDefault();


          const password =
            document
              .getElementById("new-password")
              .value;


          const confirmPassword =
            document
              .getElementById("confirm-password")
              .value;


          /*
           * Password length
           */
          if (password.length < 6) {

            showMessage(
              "Password must be at least 6 characters.",
              "error"
            );

            return;

          }


          /*
           * Password confirmation
           */
          if (
            password !== confirmPassword
          ) {

            showMessage(
              "Passwords do not match.",
              "error"
            );

            return;

          }


          updateBtn.disabled = true;

          updateBtn.textContent =
            "Updating...";


          try {

            const { error } =
              await supabaseClient.auth
                .updateUser({
                  password: password
                });


            if (error) {
              throw error;
            }


            showMessage(
              "Password updated successfully. Redirecting to login...",
              "success"
            );


            /*
             * Sign out the recovery session
             * before returning to login.
             */
            setTimeout(
              async () => {

                try {

                  await supabaseClient.auth.signOut();

                } catch (error) {

                  console.warn(
                    "Could not clear recovery session:",
                    error
                  );

                }

                window.location.replace(
                  "login.html"
                );

              },
              1200
            );


          } catch (error) {

            console.error(
              "Password update failed:",
              error
            );


            showMessage(
              error.message ||
              "Unable to update password.",
              "error"
            );


          } finally {

            updateBtn.disabled = false;

            updateBtn.textContent =
              "Update Password";

          }

        }
      );

    });

  </script></body>
</html>
