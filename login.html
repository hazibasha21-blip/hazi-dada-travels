<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Hazi Dada Travels</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../images/logo/logo.png" type="image/png">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <img src="../images/logo/logo.png" alt="Hazi Dada Travels logo">
    <h1>Admin Login</h1>
    <p class="sub">Hazi Dada Travels — Admin Panel</p>
    <div id="login-msg"></div>
    <form id="login-form">
      <div class="a-form-group">
        <label>Email</label>
        <input type="email" name="email" required autocomplete="username">
      </div>
      <div class="a-form-group">
        <label>Password</label>
        <div class="password-field">
          <input type="password" name="password" id="login-password" required autocomplete="current-password">
          <button type="button" class="password-toggle" id="toggle-password">👁️</button>
        </div>
      </div>
      <button type="submit" class="a-btn a-btn-primary a-btn-block">Login</button>
    </form>
    <p class="sub" style="margin-top:1.2rem;">
      Prototype authentication for demonstration only.<br>
      <a href="../index.html" style="color:var(--a-blue); font-weight:700;">← Back to website</a>
    </p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/data.js"></script>
<script src="../js/admin.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  if (isAdminLoggedIn()) { window.location.href = "dashboard.html"; return; }

  document.getElementById("toggle-password").addEventListener("click", () => {
    const field = document.getElementById("login-password");
    const show = field.type === "password";
    field.type = show ? "text" : "password";
  });

  document.getElementById("login-form").addEventListener("submit", async e => {
    e.preventDefault();
    const f = e.target;
    const email = f.email.value.trim().toLowerCase();
    const password = f.password.value;
    const msgEl = document.getElementById("login-msg");
    msgEl.innerHTML = "";

    const ok = await adminLogin(email, password);
    if (ok) {
      window.location.href = "dashboard.html";
    } else {
      msgEl.innerHTML = `<div class="a-msg error">Invalid login details.</div>`;
    }
  });
});
</script>
</body>
</html>
