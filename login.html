<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Hazi Dada Travels</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
<div class="admin-login-wrap">
  <div class="admin-login-card">
    <img src="logo.png" alt="Hazi Dada Travels logo">
    <h1>Hazi Dada Travels</h1>
    <p class="sub"><strong>Admin Panel</strong></p>
    <div id="login-msg"></div>
    <form id="login-form" novalidate>
      <div class="a-form-group"><label for="email">Email</label><input id="email" type="email" name="email" autocomplete="username"></div>
      <div class="a-form-group"><label for="password">Password</label>
        <div class="password-field"><input id="password" type="password" name="password" autocomplete="current-password">
        <button type="button" class="password-toggle" id="toggle-password" aria-label="Show or hide password">👁️</button></div></div>
      <button type="submit" class="a-btn a-btn-primary a-btn-block" id="login-btn">Login</button>
    </form>
    <p class="sub" style="margin-top:1.2rem;"><a href="index.html" style="color:var(--a-blue);font-weight:700;">← Back to website</a></p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="admin.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("toggle-password").addEventListener("click", () => {
    const f = document.getElementById("password"); f.type = f.type === "password" ? "text" : "password";
  });
  document.getElementById("login-form").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = document.getElementById("login-btn"), msg = document.getElementById("login-msg");
    msg.innerHTML = ""; btn.disabled = true; btn.textContent = "Logging in...";
    const res = await adminLogin(e.target.email.value.trim().toLowerCase(), e.target.password.value);
    if (res.ok) { location.replace("dashboard.html"); return; }
    msg.innerHTML = '<div class="a-msg error"></div>';
    msg.firstChild.textContent = res.message;
    btn.disabled = false; btn.textContent = "Login";
  });
  // Already signed in? Go straight to the dashboard (handlers above are attached first).
  if (await isAdminLoggedIn()) location.replace("dashboard.html");
});
</script>
</body>
</html>
